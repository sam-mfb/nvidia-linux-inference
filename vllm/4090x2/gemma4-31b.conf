# Gemma 4 31B, Google's QAT 4-bit checkpoint (~23 GB), split across both 4090s.
VLLM_MODEL=google/gemma-4-31B-it-qat-w4a16-ct
VLLM_ARGS=--tensor-parallel-size 2 --max-model-len 32768 --gpu-memory-utilization 0.90 --max-num-seqs 64 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4 --chat-template /opt/vllm/templates/tool_chat_template_gemma4.jinja
