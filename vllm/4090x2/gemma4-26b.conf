# Gemma 4 26B-A4B MoE, BF16 weights quantised to FP8 at load (~26 GB), split across both 4090s.
VLLM_MODEL=google/gemma-4-26B-A4B-it
VLLM_ARGS=--quantization fp8 --tensor-parallel-size 2 --max-model-len 32768 --gpu-memory-utilization 0.90 --max-num-seqs 64 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4 --chat-template /opt/vllm/templates/tool_chat_template_gemma4.jinja
