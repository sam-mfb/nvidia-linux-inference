# Qwen3-Coder-30B-A3B, official FP8 checkpoint (~31 GB), split across both 4090s.
# Qwen3-Coder-Next (80 GB at FP8) doesn't fit in 48 GB.
VLLM_MODEL=Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
VLLM_ARGS=--tensor-parallel-size 2 --max-model-len 65536 --gpu-memory-utilization 0.90 --max-num-seqs 64 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder
