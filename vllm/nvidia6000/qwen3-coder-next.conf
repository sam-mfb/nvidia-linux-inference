# Qwen3-Coder-Next — 80B MoE (3B active), official FP8 checkpoint, ~80 GB weights.
# Fits the 96 GB card because only 12 of 48 layers use full attention
# (the rest are linear attention), so the KV cache is tiny.
VLLM_MODEL=Qwen/Qwen3-Coder-Next-FP8
VLLM_ARGS=--max-model-len 262144 --gpu-memory-utilization 0.94 --max-num-seqs 64 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser qwen3_coder
