# Gemma 4 31B dense, BF16 weights quantised to FP8 at load (~31 GB). Text + image input.
# FP8: ~43 tok/s and full 256K context, vs ~25 tok/s and 128K at BF16 (memory-bandwidth bound).
VLLM_MODEL=google/gemma-4-31B-it
VLLM_ARGS=--quantization fp8 --max-model-len 262144 --gpu-memory-utilization 0.92 --max-num-seqs 64 --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4 --chat-template /opt/vllm/templates/tool_chat_template_gemma4.jinja
